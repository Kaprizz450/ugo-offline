name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 for SDK Manager
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK r21e
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529"

      - name: Switch to JDK 11 for Build
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build Debug APK
        run: |
          GRADLEW_PATH=$(find . -maxdepth 4 -name "gradlew" | head -n 1)
          SETTINGS_PATH=$(find . -maxdepth 4 -name "settings.gradle*" | head -n 1)
          APKTOOL_PATH=$(find . -maxdepth 3 -name "apktool.yml" | head -n 1)

          if [ -n "$GRADLEW_PATH" ]; then
            echo "Found gradlew at $GRADLEW_PATH"
            cd "$(dirname "$GRADLEW_PATH")"
            chmod +x ./gradlew
            ./gradlew assembleDebug
          elif [ -n "$SETTINGS_PATH" ]; then
            echo "Found settings.gradle at $SETTINGS_PATH"
            cd "$(dirname "$SETTINGS_PATH")"
            gradle assembleDebug
          elif [ -n "$APKTOOL_PATH" ]; then
            echo "Found apktool project at $APKTOOL_PATH"
            sudo apt-get update && sudo apt-get install -y apktool
            cd "$(dirname "$APKTOOL_PATH")"
            apktool b . -o unsigned.apk
            BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            $BUILD_TOOLS/zipalign -p 4 unsigned.apk aligned.apk
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --out ugo-offline-debug.apk aligned.apk
          else
            echo "Не найден ни Gradle, ни Apktool. Структура репозитория:"
            find . -maxdepth 3
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ugo-offline-apk
          path: "**/*.apk"
